name: Validate interactive portfolio

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run generate

      - name: Browser smoke test (desktop and mobile)
        env:
          VISUAL_LOG: '1'
        run: |
          npm run serve:generated > /tmp/portfolio-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          npm run test:browser


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-world-scenes
          path: test-results/world
          retention-days: 7
