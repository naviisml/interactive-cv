name: Validate interactive portfolio

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run generate

      - name: Browser smoke test (desktop and mobile)
        env:
          VISUAL_LOG: '1'
        run: |
          npm install --no-save --package-lock=false playwright
          npm run dev -- --host 127.0.0.1 > /tmp/portfolio-nuxt.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-world.mjs


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-world-scenes
          path: test-results/world
          retention-days: 7
